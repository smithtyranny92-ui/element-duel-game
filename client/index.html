<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>元素决斗 — 化学反应解谜卡牌游戏</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="device-shell">
      <div id="device-screen">
        <div id="root"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <style>
      html, body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #000;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        font-family: 'Noto Sans SC', sans-serif;
      }
      #device-shell {
        position: relative;
        width: min(396px, 100vw - 32px);
        aspect-ratio: 9 / 20;
        background: linear-gradient(180deg, #050505 0%, #0d0d0d 100%);
        border-radius: 38px;
        padding: 13px 9px;
        overflow: hidden;
        box-shadow: 0 0 0 1px rgba(255,255,255,0.045), 0 20px 56px rgba(0,0,0,0.82);
      }
      #device-screen {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 30px;
        overflow: hidden;
        background: #05090c;
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </body>
</html>
